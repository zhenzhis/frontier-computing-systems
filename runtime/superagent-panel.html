<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCS 自动迭代</title>
<style>body{font:16px/1.65 system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 24px;color:#26352f;background:#f4f6f3}h1{font-size:28px}button{font:inherit;min-height:44px;padding:7px 18px;border:1px solid #b6c4b8;border-radius:6px;background:white;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #276542;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}section{background:white;border:1px solid #d8dfd8;border-radius:10px;padding:22px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.muted{color:#647169}li{margin:10px 0}a{color:#276542}</style>
<h1>FCS 自动迭代</h1><p id="health" role="status">正在读取状态…</p><p><button id="pause">暂停自动推进</button> <button id="resume">恢复自动推进</button></p>
<p id="feedback" role="status" aria-live="polite"></p><section><h2>需要关注</h2><ul id="attention"></ul></section><section><h2>正在进行</h2><ul id="tasks"></ul></section><section><h2>最近结果</h2><pre id="results"></pre></section><details><summary>失败与恢复记录</summary><pre id="failures"></pre></details>
<script type="module">const api=async(url,method='GET',body)=>{const r=await fetch('/api/'+url,{method,headers:{'x-fcs-request':'1','content-type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error);return v};const text=(id,value)=>document.getElementById(id).textContent=value;function list(id,items){const e=document.getElementById(id);e.replaceChildren();for(const value of items){const li=document.createElement('li');li.textContent=value;e.append(li)}}async function refresh(){try{const s=await api('status');text('health',`${s.paused?'已暂停':'自动推进中'} · ${s.model} · ${s.running} 项正在执行`);list('attention',s.needsAttention.map(t=>`${t.title}：${t.stage.action}`));if(!s.needsAttention.length)list('attention',['当前没有待处理事项。']);list('tasks',s.tickets.filter(t=>!t.ended).map(t=>`${t.title} · ${t.stage.stage}`));if(!s.tickets.some(t=>!t.ended))list('tasks',['当前没有执行中的任务。']);text('results',s.results.length?JSON.stringify(s.results.map(r=>({status:r.status,url:r.publication?.url})),null,2):'尚无验收通过的结果。');text('failures',JSON.stringify(s.failures,null,2))}catch(e){text('health','状态读取失败：'+e.message)}}for(const action of ['pause','resume'])document.getElementById(action).onclick=async()=>{const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await api(action,'POST');text('feedback',action==='pause'?'已暂停自动推进。':'已恢复自动推进。');await refresh()}catch(e){text('feedback','操作失败：'+e.message)}finally{buttons.forEach(b=>b.disabled=false)}};await refresh();setInterval(refresh,5000);</script></html>
